# Lot 129 — chaîne d'intégration continue : à chaque envoi de code et chaque demande de fusion, tout ce
# qui se vérifie par une machine est vérifié. Équivalent local : `npm run verify` (dossier app/).
#
# NON EXÉCUTÉ SUR GITHUB à la rédaction : le dépôt n'a pas de serveur distant. Chaque étape a été
# reproduite en local (voir CHANGELOG, Lot 129) ; la première exécution réelle est à surveiller.
#
# Les mots de passe ci-dessous sont ceux de conteneurs PostgreSQL JETABLES créés pour la durée du
# travail : ce ne sont pas des secrets. Aucun secret du projet n'est nécessaire (SMTP, S3, Redis et
# clés VAPID sont absents : le site retombe sur ses modes de secours, comme dans les tests locaux).

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  POSTGRES_PASSWORD: ci-conteneur-jetable
  DATABASE_URL: postgresql://souq_auto:ci-conteneur-jetable@localhost:5432/souq_auto
  E2E_DATABASE_URL: postgresql://souq_auto:ci-conteneur-jetable@localhost:5432/souq_auto_e2e
  SHADOW_DATABASE_URL: postgresql://souq_auto:ci-conteneur-jetable@localhost:5432/souq_auto_shadow
  NEXT_PUBLIC_SITE_URL: http://localhost:5185
  # Valeurs propres à la CI (jamais celles d'un vrai environnement) : suffisantes pour démarrer le site.
  JWT_SECRET: ci-jwt-secret-jetable-0123456789abcdef0123456789abcdef

defaults:
  run:
    working-directory: app

jobs:
  checks:
    name: Types, lint, tests, migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: souq_auto
          POSTGRES_PASSWORD: ci-conteneur-jetable
          POSTGRES_DB: souq_auto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U souq_auto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Installer les dépendances (verrou respecté à l'identique)
        run: npm ci
      - name: Générer le client de base de données
        run: npx prisma generate
      - name: Types
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Tests unitaires et cohérence des textes français / arabes
        run: npm test
      - name: Créer la base de contrôle des écarts
        run: PGPASSWORD="$POSTGRES_PASSWORD" psql -h localhost -U souq_auto -d souq_auto -c "CREATE DATABASE souq_auto_shadow"
      - name: Les migrations s'appliquent sur une base vide
        run: npx prisma migrate deploy
      - name: Le schéma ne diffère pas des migrations (aucune migration oubliée)
        # Tolère uniquement les index GIN pg_trgm conditionnels (cf. app/src/lib/schema-drift.ts) ; tout autre écart échoue.
        run: npx tsx scripts/check-schema-drift.ts
      - name: Vulnérabilités connues des dépendances de production (information)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  e2e:
    # Suite découpée en jobs courts + la version de production : chaque job a son serveur et sa base. Le serveur de
    # développement de test (`next dev`) FUIT de la mémoire (mesuré : ~0,2 Go/min de données vivantes ; Next.js le redémarre
    # à 80 % du tas vers 20-25 min, ce qui coupe les requêtes en cours, et sans ce garde-fou il plante par « JavaScript
    # heap out of memory » vers 32 min). Un serveur qui vit moins de ~15 min n'atteint jamais le seuil.
    #  - « accessibilite » : les audits axe (accessibility.spec.ts, 12 tests, ~15 min à eux seuls), un job par langue ;
    #  - « principale »    : tout le reste, en 3 tranches (Playwright --shard), accessibility.spec.ts exclu par --grep-invert.
    # (Playwright 1.63 découpe en blocs contigus de tests : un fichier lourd et unique ne peut pas être réparti autrement.)
    name: Tests de bout en bout (${{ matrix.suite }} ${{ matrix.shard }}${{ matrix.langue }})
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: principale, shard: "1/3" }
          - { suite: principale, shard: "2/3" }
          - { suite: principale, shard: "3/3" }
          - { suite: accessibilite, langue: "en français" }
          - { suite: accessibilite, langue: "en arabe" }
          - { suite: production }
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: souq_auto
          POSTGRES_PASSWORD: ci-conteneur-jetable
          POSTGRES_DB: souq_auto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U souq_auto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Installer les dépendances
        run: npm ci
      - name: Générer le client de base de données
        run: npx prisma generate
      - name: Clé de chiffrement propre à cette exécution
        run: echo "ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: Installer le navigateur de test
        run: npx playwright install --with-deps chromium
      - name: Créer la base des tests de bout en bout
        run: PGPASSWORD="$POSTGRES_PASSWORD" psql -h localhost -U souq_auto -d souq_auto -c "CREATE DATABASE souq_auto_e2e"
      - name: Mesure de la mémoire (information)
        # Échantillonne la mémoire toutes les 30 s pendant les deux suites ; affichée à la fin du job. Aucun effet sur les tests.
        run: nohup bash scripts/ci-memory-sampler.sh "$RUNNER_TEMP/memoire.log" 30 > /dev/null 2>&1 &
      - name: Tests de bout en bout (tranche ${{ matrix.shard }})
        if: matrix.suite == 'principale'
        run: npm run test:e2e -- --grep-invert 'accessibility\.spec\.ts' --shard=${{ matrix.shard }}
      - name: Audits d'accessibilité (${{ matrix.langue }})
        if: matrix.suite == 'accessibilite'
        run: npm run test:e2e -- --grep 'accessibility\.spec\.ts.*${{ matrix.langue }}'
      - name: Application installable (version de production)
        if: matrix.suite == 'production'
        run: npm run test:e2e:pwa
      - name: Mémoire pendant les tests (information)
        if: always()
        run: |
          echo "heure UTC | mémoire du système | processus les plus gourmands (taille résidente)"
          cat "$RUNNER_TEMP/memoire.log" || true
      - name: Conserver les traces en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-playwright-${{ strategy.job-index }}
          path: |
            app/test-results/
            app/playwright-report/
          retention-days: 3

  docker:
    name: Construction de l'image Docker
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3
      # Construction de l'étape runner (la cible par défaut). BUILD_STANDALONE=1 est passé dans le
      # Dockerfile. NEXT_PUBLIC_SITE_URL pointe sur l'instance de test : elle est intégrée à la
      # compilation, mais n'importe quelle URL https suffit pour que le build réussisse.
      - name: Construire l'image (sans la pousser)
        uses: docker/build-push-action@v6
        with:
          context: app
          push: false
          tags: souq-auto:ci
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://ci.souqauto.test
          cache-from: type=gha
          cache-to: type=gha,mode=max
