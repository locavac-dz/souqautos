name: Signaler un bug
description: Signaler un probleme avec Souq Autos
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de prendre le temps de signaler ce bug.

  - type: textarea
    id: description
    attributes:
      label: Description du bug
      description: Description claire et concise du probleme.
      placeholder: Decrivez le bug...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Etapes pour reproduire
      description: Les etapes pour reproduire le probleme.
      placeholder: |
        1. Aller sur '...'
        2. Cliquer sur '...'
        3. Faire defiler jusqu'a '...'
        4. Le bug apparait
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
      description: Ce qui devrait se passer normalement.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Comportement observe
      description: Ce qui se passe a la place.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Captures d'ecran
      description: Si applicable, ajoutez des captures d'ecran.

  - type: dropdown
    id: browser
    attributes:
      label: Navigateur
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Opera
        - Samsung Internet
        - Autre
    validations:
      required: true

  - type: dropdown
    id: device
    attributes:
      label: Appareil
      options:
        - PC / Desktop
        - Mobile Android
        - Mobile iOS
        - Tablette
    validations:
      required: true

  - type: dropdown
    id: locale
    attributes:
      label: Langue du site
      options:
        - Francais (FR)
        - Arabe (AR)
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Informations supplementaires
      description: Tout autre contexte utile (version du navigateur, URL, logs console...).
