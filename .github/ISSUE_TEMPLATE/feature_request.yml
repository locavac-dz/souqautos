name: Demande de fonctionnalite
description: Proposer une nouvelle fonctionnalite ou une amelioration
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de proposer une amelioration pour Souq Autos.

  - type: textarea
    id: problem
    attributes:
      label: Probleme ou besoin
      description: Quel probleme cette fonctionnalite resoudrait-elle ?
      placeholder: Je suis frustre quand...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Solution proposee
      description: Decrivez la fonctionnalite que vous aimeriez voir.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives envisagees
      description: Avez-vous considere d'autres approches ?

  - type: dropdown
    id: scope
    attributes:
      label: Perimetre
      options:
        - Annonces
        - Recherche
        - Compte utilisateur
        - Messagerie
        - Paiement
        - Administration
        - Comptes pro
        - Magazine / Essais
        - SEO
        - Performance
        - Mobile / PWA
        - Autre
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Importance pour vous
      options:
        - Indispensable
        - Souhaitable
        - Bonus
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Contexte supplementaire
      description: Captures d'ecran, maquettes, liens vers des sites de reference...
